asset_id = "futures"
frequency = "5m"
provider = "ricequant"
data_dir = "data/futures"
default_universe = "all"
universes = ["all"]
timezone = "Asia/Shanghai"
bar_time_label = "end"
price_field = "close"
target_horizon_bars = 12
metric = "time_series_weighted_pearson_ic"
# Both full splits must exceed this IC after fixing direction from train.
min_train_val_ic = 0.005
# Pool contracts per product; report Spearman and Pearson, weighted and equal-product.
# Primary weights: sqrt(total eligible turnover within the entire scoring split).
fundamentals = false
start = 2015-01-01
end = 2026-09-01

[acquisition]
frequency = "5m"
adjust_type = "none"
contract_scope = "all_products_dominant_real_contracts"
dominant_rule = 0
credential_env = "RICEQUANT_LICENSE_KEY"
