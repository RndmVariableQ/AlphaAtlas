asset_id = "us_equity"
frequency = "1d"
provider = "crsp_compustat"
data_dir = "data/us_equity"
default_universe = "all"
universes = ["all"]
timezone = "America/New_York"
bar_time_label = "end"
target_return_field = "total_return"
target_horizon_bars = 21
metric = "cross_sectional_spearman"
fundamentals = true
transform_groupby = ["gsector"]  # Shared by factor and target transforms.

[factor_transform]
method = "z_score"
clip_quantiles = [0.01, 0.99]

[target_transform]
method = "sector_demean"  # Or sector_demedian, sector_zscore.
clip_quantiles = [0.01, 0.99]  # Omit to disable; independent of factor clipping.
