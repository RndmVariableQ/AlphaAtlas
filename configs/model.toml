# Common downstream models for every frozen factor library. Train only; no automatic tuning.
seed = 42

[preprocessing]
clip_quantiles = [0.01, 0.99]
product_demean = true

[linear]
rcond = 1e-12

[lightgbm]
num_boost_round = 50
learning_rate = 0.05
num_leaves = 15
min_data_in_leaf = 100
lambda_l2 = 1.0
num_threads = 4
