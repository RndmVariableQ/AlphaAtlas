<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1030" viewBox="0 0 1680 1030" role="img" aria-labelledby="title desc">
  <title id="title">Map-Guided Alpha Discovery</title>
  <desc id="desc">Three V4 DeepSeek plans illustrate adding a predictor, testing a competing explanation and finding a signal's limits. Below, three columns trace Atlas Regions through admitted factors to abstract trial evidence. An elliptical workflow links Explorer, Analyst, Miner and the hypothesis map. Cross-links are illustrative.</desc>
  <defs>
    <!-- One projection for all three plates and the same depth vector on each side. -->
    <path id="plate-top" d="M0 128 165 0H1154L989 128Z"/>
    <path id="plate-front" d="M0 128H989V154H0Z"/>
    <path id="plate-side" d="M989 128 1154 0V26L989 154Z"/>
    <path id="plate-highlight" d="M-109 4C-111-13-77-27-34-25C-7-24 7-32 30-31C65-31 108-21 110-5C112 10 87 25 50 28C25 30 11 23-15 26C-59 32-105 23-109 4Z"/>
    <path id="hypothesis-top" d="M0 128 165 0H343C384-1 415 14 463 14C516 15 550-8 609-7C654-7 682 8 729 8C779 9 827-7 865-6C912-6 950 3 990 3C1047 3 1101-1 1154 0L989 128Z"/>
    <clipPath id="hypothesis-surface">
      <use href="#hypothesis-top" transform="translate(83 237)"/>
    </clipPath>
    <path id="explorer-trail" d="M431 281C456 296 474 312 507 310C550 308 569 281 606 268C646 252 663 256 685 266C723 284 743 307 777 308C809 310 832 291 868 291"/>
    <mask id="terrain-behind-trail" maskUnits="userSpaceOnUse" x="83" y="237" width="1154" height="128">
      <rect x="83" y="237" width="1154" height="128" fill="#fff"/>
      <use href="#explorer-trail" fill="none" stroke="#000" stroke-width="8.5" stroke-linecap="round"/>
    </mask>
    <marker id="workflow-tip" markerWidth="36" markerHeight="34" refX="10" refY="17" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 36 34">
      <path fill="#f8512b" d="M1 1 34 17 1 33Z"/>
    </marker>
    <g id="agent-head">
      <circle cx="0" cy="0" r="17.5" fill="#ffd7a7"/>
      <path fill="#101921" d="M-16 8C-21-3-15-16-5-18C5-21 14-16 17-7C7-9 1-3-6 2Z"/>
    </g>
    <style>
      text { font-family: "Helvetica Neue", "DejaVu Sans", sans-serif; fill: #101921; }
      .mode { font-size: 25px; font-weight: 700; letter-spacing: -.65px; }
      .case-question { font-size: 18px; letter-spacing: -.35px; }
      .case-detail { font-size: 16px; letter-spacing: -.35px; }
      .role { font-size: 26px; font-weight: 700; letter-spacing: -.8px; }
      .factor { font-size: 23px; font-weight: 700; letter-spacing: -.7px; }
      .section { font-size: 25px; font-weight: 700; letter-spacing: -.75px; }
      .question { font-size: 22px; letter-spacing: -.75px; }
      .navy { fill: #101921; }
      .blue { fill: #0551d5; }
      .cream { fill: #fff5e6; }
      .paper-text { fill: #fff5e6; }
      .red { fill: #f43c20; }
      .yellow { fill: #ffc11a; }
      .contour { fill: none; stroke: #fff5e6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .highlight { fill: #ffd19e; stroke: #ee3d22; stroke-width: 2.5; }
      .relation { fill: none; stroke: #101921; stroke-width: 3.3; stroke-linecap: round; stroke-dasharray: .1 8; }
      .ribbon { fill: none; stroke: #f8512b; stroke-width: 17; stroke-linecap: butt; marker-end: url(#workflow-tip); }
    </style>
  </defs>

  <rect width="1680" height="1030" fill="#fbf2e6"/>

  <g aria-label="Explorer’s research modes">
    <path class="blue" opacity=".065"
          d="M76 28H1626Q1650 28 1650 52V140Q1650 164 1626 164H564
             C518 164 480 178 456 207Q448 217 440 207
             C418 179 390 164 346 164H76Q52 164 52 140V52Q52 28 76 28Z"/>
    <g transform="translate(0 29)">
      <title>Expansion · Plan 2. Test whether signed 5-minute bar volume forecasts continuation over the next 12 bars.</title>
      <g transform="translate(72 44)" fill="none" stroke="#0551d5" stroke-width="3.4" stroke-linecap="round">
        <path d="M0 25h22m0 0c21 0 13-28 55-28M22 25h55m-55 0c21 0 13 28 55 28"/>
        <circle class="red" cx="90" cy="-3" r="8.5" stroke="none"/>
        <rect class="blue" x="82" y="17" width="17" height="17" stroke="none"/>
        <path class="red" d="M90 43l10 18H80Z" stroke="none"/>
      </g>
      <text class="mode" x="211" y="53">Knowledge Expansion</text>
      <text class="case-question" x="211" y="79">Can signed volume predict continuation?</text>
      <text class="case-detail" x="211" y="103">Price reversal → Add signed volume</text>
    </g>

    <g transform="translate(0 29)">
      <title>Revision · Plan 19. Test a competing source of the signal. Does it come from persistent order flow or from where the bar closes within its high-low range? Removing volume weighting and multi-bar aggregation produced the single-bar candidate admitted in trial 72.</title>
      <g transform="translate(600 44)">
        <path d="M0 45h18c31 0 1-44 34-44h25c22 0 6 22 27 22h16m-9-8 9 8-9 8" fill="none" stroke="#f43c20" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect class="blue" x="54" y="15" width="17" height="17"/>
      </g>
      <text class="mode" x="739" y="53">Knowledge Revision</text>
      <text class="case-question" x="739" y="79">What drives the order-flow signal?</text>
      <text class="case-detail" x="739" y="103">Order splitting → Close location?</text>
    </g>

    <g transform="translate(0 29)">
      <title>Refinement · Plan 79. Follow up on the admitted compressed-range breakout from trial 243. Compare a close just beyond the prior session's range with a close far beyond it.</title>
      <g transform="translate(1128 44)" fill="none" stroke="#0551d5" stroke-width="3">
        <path d="M110 25C78 10 57-3 34-3C-7-3-7 53 34 53C57 53 78 40 110 25Z"/>
        <path d="M93 25C68 13 53 5 35 5C5 5 5 45 35 45C53 45 68 37 93 25Z"/>
        <path d="M75 25C58 16 48 13 37 13C19 13 19 37 37 37C48 37 58 34 75 25Z" stroke="#f43c20"/>
        <circle class="yellow" cx="37" cy="25" r="6.5" stroke="none"/>
      </g>
      <text class="mode" x="1267" y="53">Knowledge Refinement</text>
      <text class="case-question" x="1267" y="79">Which breakouts persist after a squeeze?</text>
      <text class="case-detail" x="1267" y="103">Squeeze breakout → Near vs. far</text>
    </g>
  </g>

