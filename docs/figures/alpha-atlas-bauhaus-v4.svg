    <g aria-label="Factor implementations">
      <g aria-label="120D Price Stretch">
        <title>val_daily_120
anchor = TS_MEAN($adj_close@1d, 120)
$adj_close@1d / anchor - 1</title>
        <path fill="#fff5e6" d="M271 570l33-23h176l-33 23Z"/>
        <path fill="#0551d5" d="M271 570h176v16H271Z"/>
        <path fill="#083797" d="M447 570l33-23v16l-33 23Z"/>
        <path fill="#fff5e6" d="M305 552l28-20h117l-28 20Z"/>
        <path fill="#0551d5" d="M305 552h117v15H305Z"/>
        <path fill="#083797" d="M422 552l28-20v15l-28 20Z"/>
        <text class="factor" x="377" y="612" text-anchor="middle">120D Price Stretch</text>
      </g>
      <g aria-label="Squeeze Breakout">
        <title>compressed_session_range_outside_5m
rng = SUBTRACT($adj_high@1d, $adj_low@1d)
comp = DIVIDE(rng, TS_MEAN(rng, 20))
mid = DIVIDE(ADD($adj_high@1d, $adj_low@1d), 2)
half = DIVIDE(SUBTRACT($adj_high@1d, $adj_low@1d), 2)
pos = DIVIDE(SUBTRACT($adj_close, mid), half)
IF_THEN_ELSE(AND(GT(ABS(pos), 1), LE(TS_RANK(comp, 120), 0.5)), pos, 0)</title>
        <path class="blue" d="M540 569h156v12c0 12-35 22-78 22s-78-10-78-22Z"/>
        <ellipse class="cream" cx="618" cy="569" rx="78" ry="19"/>
        <path class="blue" d="M558 551h120v11c0 10-27 18-60 18s-60-8-60-18Z"/>
        <ellipse class="cream" cx="618" cy="551" rx="60" ry="16"/>
        <path class="blue" d="M578 533h80v10c0 8-18 14-40 14s-40-6-40-14Z"/>
        <ellipse class="cream" cx="618" cy="533" rx="40" ry="12"/>
        <text class="factor" x="618" y="620" text-anchor="middle">Squeeze Breakout</text>
      </g>
      <g aria-label="Close Pressure">
        <title>single_bar_pressure_zscore_5m_240
pressure = SUBTRACT(MULTIPLY(2, DIVIDE(SUBTRACT($adj_close, $adj_low), SUBTRACT($adj_high, $adj_low))), 1)
TS_ZSCORE(pressure, 240)</title>
        <path fill="#fff5e6" d="M794 566l29-20h176l-29 20Z"/>
        <path fill="#0551d5" d="M794 566h176v24H794Z"/>
        <path fill="#083797" d="M970 566l29-20v24l-29 20Z"/>
