        <path fill="#083797" d="M928 538l24-17v26l-24 17Z"/>
        <path fill="#fff5e6" d="M815 504l24-17h47l-24 17Z"/>
        <path fill="#0551d5" d="M815 504h47v25h-47Z"/>
        <path fill="#083797" d="M862 504l24-17v25l-24 17Z"/>
        <circle cx="811" cy="510" r="4" fill="#ffd7a7"/>
        <use href="#plate-highlight" class="highlight" transform="translate(909 609) scale(.88 .60)"/>
        <text class="factor" x="909" y="617" text-anchor="middle">Close Pressure</text>
