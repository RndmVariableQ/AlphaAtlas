    <g aria-label="Hypotheses and their implementation links">
      <text class="factor paper-text" x="382" y="345" text-anchor="middle"><title>Patient holders anchor long-run value · Plan 7</title>Value Anchoring</text>
      <text class="factor paper-text" x="640" y="345" text-anchor="middle"><title>Stop cascade after range compression · Plan 72</title>Range Compression</text>
      <text class="factor" x="901" y="334" text-anchor="middle"><title>Order-splitting flow persistence · Plan 19</title>Order Flow</text>
      <g aria-label="Value Anchoring links to 120D Price Stretch. Range Compression links to Squeeze Breakout. Order Flow links to Close Pressure. The lighter cross-link is illustrative.">
