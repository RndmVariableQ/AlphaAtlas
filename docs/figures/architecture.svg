<svg viewBox="0 0 1515 205" width="1515" height="205" role="img" aria-label="流程图：期货数据、资产适配、A股数据、美股待接入、MarketData、共享研究平台、搜索方法、因子库与记录" xmlns="http://www.w3.org/2000/svg">
