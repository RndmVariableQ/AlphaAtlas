[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alpha-atlas"
version = "0.1.0"
description = "Asset-neutral factor discovery experiments with a shared evidence atlas"
requires-python = ">=3.13,<3.14"
dependencies = [
    "polars>=1.44.1,<2",
    "duckdb>=1.3,<2",
    "numpy>=2.2,<3",
    "pyarrow>=19",
    "python-dotenv>=1",
    "numba>=0.63,<0.66",
    "lightgbm>=4.6,<5",
    "agentscope>=2.0.4.post1,<3",
]

[project.optional-dependencies]
ricequant = ["rqdatac==3.6.3", "pandas>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
atlas = "alpha_atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_atlas"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
